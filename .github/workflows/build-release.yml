name: build-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main
        run: |
          npx tsc -p tsconfig.web.json
          npx vite build
          npx tsc -p tsconfig.electron.json

      - name: Build macOS (x64 + arm64 dmg)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --x64 --arm64

      - name: Build Linux (x64 + arm64 AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --x64 --arm64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cert-studio-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

      - name: Attach to GitHub release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.AppImage
