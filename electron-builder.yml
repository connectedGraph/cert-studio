{
  "appId": "com.certstudio.app",
  "productName": "Cert Studio",
  "directories": {
    "output": "release",
    "buildResources": "build"
  },
  "files": [
    "dist/**/*",
    "dist-electron/**/*"
  ],
  "win": {
    "icon": "build/icon.ico",
    "target": [
      { "target": "portable", "arch": ["x64", "arm64"] }
    ]
  },
  "mac": {
    "icon": "build/icon.png",
    "category": "public.app-category.education",
    "target": [
      { "target": "dmg", "arch": ["x64", "arm64"] }
    ]
  },
  "linux": {
    "icon": "build/icon.png",
    "category": "Education",
    "target": [
      { "target": "AppImage", "arch": ["x64", "arm64"] }
    ]
  }
}
